name: AI BUBLE refresh

on:
  schedule:
    # Prices: weekdays at 23:00 UTC (after the US market close). Cron is UTC + best-effort.
    - cron: "0 23 * * 1-5"
    # Quarterly deep checkpoints (a few days after each hyperscaler+NVIDIA earnings season):
    - cron: "0 13 3 2,5,8,11 *"
  workflow_dispatch: {}   # lets you run it manually from the Actions tab

# Allow the workflow to commit the refreshed data.json back to the repo.
permissions:
  contents: write

# Avoid overlapping runs.
concurrency:
  group: ai-buble-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Refresh dashboard data
        env:
          # Optional: add a TAVILY_API_KEY repo secret to also pull weekly headlines.
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: node scripts/refresh.mjs

      - name: Commit if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: refresh AI BUBLE data [skip ci]"
            git push
          fi

# ── OPTIONAL SMART TIER ───────────────────────────────────────────────────────
# To run the FULL quarterly Claude analysis in the cloud (re-score the 8 triggers,
# re-weight probabilities, update the check log), add an ANTHROPIC_API_KEY secret
# and a second job that calls the Anthropic API with the AI BUBLE prompt, then
# writes the result into data.json. Costs a few cents per quarterly run.
# See README.md → "Smart tier (optional)".
